<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | VittaraFit</title>
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <div class="login">
        <div class="card-login">

            <div class="cabecalho-login">
                <img src="logo-abrev.png" alt="Logo da VittaraFit" class="logo-login">
                <h2 id="signup-title">Faça seu cadastro!</h2>
            </div>

            <form id="signup-form">
                <label for="name">Nome</label>
                <input id="name" name="name" type="text" autocomplete="name"
                       placeholder="Como podemos chamar você?" required>

                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" autocomplete="email"
                       placeholder="seuemail@exemplo.com" required>

                <label for="password">Senha</label>
                <div class="campo-senha">
                    <input id="password" name="password" type="password" autocomplete="new-password"
                           placeholder="Mínimo de 6 caracteres" minlength="6" required>
                    <button type="button" id="toggle-password" class="btn-mostrar-senha"
                            aria-label="Mostrar senha"></button>
                </div>

                <label for="confirm-password">Confirmar senha</label>
                <div class="campo-senha">
                    <input id="confirm-password" name="confirm-password" type="password"
                           autocomplete="new-password" placeholder="Repita sua senha" minlength="6" required>
                    <button type="button" id="toggle-confirm" class="btn-mostrar-senha"
                            aria-label="Mostrar confirmação de senha"></button>
                </div>

                <p id="signup-message" class="erro" role="alert" aria-live="polite"></p>
                <button type="submit" class="btn-entrar submit-button">Criar minha conta</button>
            </form>

            <p class="texto-cadastro">
                Já tem uma conta? <a href="login.html">Entrar</a>
            </p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/cadastro.js"></script>
</body>

</html>
