<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | VittaraFit</title>
    <link rel="stylesheet" href="css/cadastro.css">
</head>

<body class="signup-body">
    <main class="login-page signup-page">
        <section class="login-intro">
            <p class="eyebrow">VittaraFit</p>
            <h1>Comece uma rotina mais leve.</h1>
            <p class="intro-text">Crie sua conta para organizar sua alimentação e acompanhar seu bem-estar.</p>
        </section>

        <section class="login-panel" aria-labelledby="signup-title">
            <div class="brand-mark">
                <img src="logo VF.png" alt="Logo da VittaraFit" class="logo">
            </div>
            <p class="eyebrow">Novo acesso</p>
            <h2 id="signup-title">Criar conta</h2>
            <p class="panel-text">Preencha seus dados para começar.</p>

            <form id="signup-form">
                <label for="name">Nome</label>
                <input id="name" name="name" type="text" autocomplete="name" placeholder="Como podemos chamar você?" required>

                <label for="email" class="field-spaced">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="seu@email.com" required>

                <div class="password-label">
                    <label for="password">Senha</label>
                    <button type="button" id="toggle-password" class="text-button">Mostrar</button>
                </div>
                <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Mínimo de 6 caracteres" minlength="6" required>

                <label for="confirm-password" class="field-spaced">Confirmar senha</label>
                <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" placeholder="Repita sua senha" minlength="6" required>

                <p id="signup-message" class="message" role="alert" aria-live="polite"></p>
                <button type="submit" class="submit-button">Criar minha conta</button>
            </form>

            <p class="account-link">Já tem uma conta? <a href="login.html">Entrar</a></p>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/cadastro.js"></script>
</body>

</html>
