<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | VittaraFit</title>
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <main class="login-page">
        <section class="login-intro">
            <p class="eyebrow">VittaraFit</p>
            <h1>Cuide da sua rotina com mais leveza.</h1>
            <p class="intro-text">Sua alimentação consciente e organizada de verdade!</p>
        </section>

        <section class="login-panel" aria-labelledby="login-title">
            <div class="brand-mark">
                <img src="logo VF.png" alt="Logo da VittaraFit" class="logo">
            </div>
            <p class="eyebrow">Acesso pessoal</p>
            <h2 id="login-title">Bem-vindo de volta</h2>
            <p class="panel-text">Entre para continuar sua jornada.</p>

            <form id="login-form">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="seu@email.com" required>

                <div class="password-label">
                    <label for="password">Senha</label>
                    <button type="button" id="toggle-password" class="text-button">Mostrar</button>
                </div>
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>

                <p id="login-message" class="message" role="alert" aria-live="polite"></p>
                <button type="submit" class="submit-button">Entrar</button>
            </form>

            <p class="account-link">Ainda não tem uma conta? <a href="cadastro.html">Criar cadastro</a></p>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
