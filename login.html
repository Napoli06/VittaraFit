<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | VittaraFit</title>
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <div class="login">
        <div class="card-login">

            <div class="cabecalho-login">
                <img src="logo-abrev.png" alt="Logo da VittaraFit" class="logo-login">
                <h2 id="login-title">Bem-vindo de volta!</h2>
            </div>

            <form id="login-form">
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" autocomplete="email"
                       placeholder="seuemail@exemplo.com" required>

                <label for="password">Senha</label>
                <div class="campo-senha">
                    <input id="password" name="password" type="password"
                           autocomplete="current-password" placeholder="Digite sua senha" required>
                    <button type="button" id="toggle-password" class="btn-mostrar-senha"
                            aria-label="Mostrar senha"></button>
                </div>

                <p id="login-message" class="erro" role="alert" aria-live="polite"></p>
                <button type="submit" class="btn-entrar submit-button">Entrar</button>
            </form>

            <p class="texto-cadastro">
                Ainda não tem uma conta? <a href="cadastro.html">Criar conta</a>
            </p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
